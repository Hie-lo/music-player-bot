name: music-player-bot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: musicbot
      POSTGRES_USER: musicbot
      POSTGRES_PASSWORD: musicbot
    ports:
      - "${POSTGRES_HOST_PORT:-5431}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicbot -d musicbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
