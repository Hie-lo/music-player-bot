[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "music-player-bot"
version = "0.1.0"
description = "A modular Telegram media playback platform with a platform-independent core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Music Player Bot contributors" }]
dependencies = []

[project.optional-dependencies]
core = [
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<26",
]
telegram = [
    "aiogram>=3.31,<4",
    "telethon>=1.45,<2",
    "py-tgcalls>=2.3.3,<3",
]
media = [
    "yt-dlp>=2026.8",
    "aiohttp>=3.11,<4",
]
data = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "redis>=6,<7",
    "alembic>=1.15,<2",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]
all = [
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<26",
    "aiogram>=3.31,<4",
    "telethon>=1.45,<2",
    "py-tgcalls>=2.3.3,<3",
    "yt-dlp>=2026.8",
    "aiohttp>=3.11,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "redis>=6,<7",
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[project.scripts]
music-bot-session = "music_player_bot.tools.generate_session:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
